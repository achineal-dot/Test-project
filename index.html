<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 업무 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
  <header class="flex justify-between items-center pb-6 border-b border-slate-700 mb-8">
    <h1 class="text-2xl font-bold">💼 Personal Work Dashboard</h1>
    <span id="clock" class="text-slate-400 font-mono"></span>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- 오늘 할 일 섹션 -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
      <h2 class="text-lg font-semibold mb-4 text-sky-400">📝 오늘 집중 업무</h2>
      <ul class="space-y-2 text-sm text-slate-300">
        <li class="p-2 bg-slate-700/50 rounded">일일 업무 리포트 작성</li>
        <li class="p-2 bg-slate-700/50 rounded">협력사 미팅 일정 조율</li>
        <li class="p-2 bg-slate-700/50 rounded">주요 지표 데이터 정리</li>
      </ul>
    </section>

    <!-- 빠른 링크 섹션 -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
      <h2 class="text-lg font-semibold mb-4 text-emerald-400">🔗 빠른 바로가기</h2>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <a href="https://mail.google.com" target="_blank" class="p-2 bg-slate-700/50 hover:bg-slate-700 rounded text-center">업무 메일</a>
        <a href="https://calendar.google.com" target="_blank" class="p-2 bg-slate-700/50 hover:bg-slate-700 rounded text-center">캘린더</a>
        <a href="https://drive.google.com" target="_blank" class="p-2 bg-slate-700/50 hover:bg-slate-700 rounded text-center">드라이브</a>
        <a href="https://github.com" target="_blank" class="p-2 bg-slate-700/50 hover:bg-slate-700 rounded text-center">GitHub</a>
      </div>
    </section>

    <!-- 메모 섹션 -->
    <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
      <h2 class="text-lg font-semibold mb-4 text-amber-400">📌 간이 메모장</h2>
      <textarea class="w-full h-32 bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 resize-none focus:outline-none" placeholder="휘발성 메모를 적어두세요..."></textarea>
    </section>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleString('ko-KR');
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
